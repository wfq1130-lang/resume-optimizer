[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:backend]
command=python backend_api.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/backend.log
stderr_logfile=/var/log/backend.log
environment=HOST="0.0.0.0",BACKEND_PORT="5002"

[program:frontend]
command=python app.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/frontend.log
stderr_logfile=/var/log/frontend.log
environment=HOST="0.0.0.0",PORT="5001",BACKEND_URL="http://127.0.0.1:5002"
