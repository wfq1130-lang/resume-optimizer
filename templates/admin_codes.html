<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兑换码已生成</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container" style="max-width:600px;padding:40px 20px">
  <div class="card" style="text-align:center;padding:32px">
    <h3 style="font-weight:700;margin-bottom:8px">兑换码已生成</h3>
    <p style="color:var(--text-secondary);font-size:.88rem;margin-bottom:20px">每个码赠送 {{ quota }} 次分析</p>
    <div style="background:#f8fafc;padding:20px;border-radius:var(--radius);margin-bottom:20px">
      {% for code in codes %}
      <div style="font-family:monospace;font-size:1.1rem;font-weight:700;padding:8px;margin:4px 0;background:#fff;border-radius:4px;border:1px solid var(--border)">{{ code }}</div>
      {% endfor %}
    </div>
    <button class="btn btn-outline btn-sm" onclick="copyAll()">📋 复制全部</button>
    <a href="/admin" class="btn btn-primary btn-sm">返回后台</a>
  </div>
</div>
<script>
function copyAll() {
  var codes = [{% for code in codes %}'{{ code }}'{% if not loop.last %},{% endif %}{% endfor %}];
  navigator.clipboard.writeText(codes.join('\n')).then(function() {
    alert('已复制 ' + codes.length + ' 个兑换码');
  });
}
</script>
</body>
</html>
