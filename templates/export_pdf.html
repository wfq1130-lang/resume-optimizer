<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @page { margin: 2cm 2.5cm; size: A4; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11pt; line-height: 1.6; color: #1e293b; }
  h1 { font-size: 18pt; text-align: center; color: #4f6ef7; margin-bottom: 20px; }
  .meta { text-align: center; color: #94a3b8; font-size: 9pt; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; }
  .score { display: inline-block; background: linear-gradient(135deg,#4f6ef7,#8b5cf6); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 9pt; font-weight: 600; }
  .content { white-space: pre-wrap; font-size: 10pt; line-height: 1.7; }
  .footer { margin-top: 30px; text-align: center; color: #94a3b8; font-size: 8pt; border-top: 1px solid #e2e8f0; padding-top: 16px; }
</style>
</head>
<body>
  <h1>优化简历</h1>
  <div class="meta">
    {% if score %}<span class="score">综合评分：{{ score }}分</span>{% endif %}
    <span style="margin-left:16px">生成时间：{{ created_at }}</span>
  </div>
  <div class="content">{{ optimized_resume }}</div>
  <div class="footer">由 ResumeWise 简历优化分析平台生成 · AI智能优化</div>
</body>
</html>
