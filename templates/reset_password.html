<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重置密码 — 简历优化分析平台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
<div class="login-box" style="max-width:400px">
  <h1>重置密码</h1>
  <div class="card-wrapper" id="tilt-card">
    <div class="card" style="padding:24px">
      {% if not token_valid %}
      <div class="error">重置链接已失效或不存在，请重新申请找回密码。</div>
      <div style="text-align:center;margin-top:12px">
        <a href="/forgot" class="btn btn-outline">重新找回</a>
      </div>
      {% else %}
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <form method="POST">
        <div class="form-group">
          <label for="reset-password">新密码（至少6位）</label>
          <input type="password" name="password" id="reset-password" class="form-control" required autofocus>
        </div>
        <div class="form-group">
          <label for="reset-password2">确认新密码</label>
          <input type="password" name="password2" id="reset-password2" class="form-control" required
                 oninput="checkMatch(this)">
          <div style="font-size:.78rem;color:var(--danger);margin-top:4px;display:none" id="mismatch-msg">两次密码不一致</div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:11px;font-size:1rem" id="submit-btn">重置密码</button>
      </form>
      {% endif %}
    </div>
  </div>
  <div style="text-align:center;margin-top:14px;font-size:.82rem;color:var(--text-muted)">
    <a href="/login">返回登录</a>
  </div>
</div>
</div>

<script>
(function() {
  var glow = document.getElementById('cursor-glow');
  if (!glow) return;
  var mx=0,my=0,cx=window.innerWidth/2,cy=window.innerHeight/2;
  var rafId=null,idleTimer=null,running=false;
  document.addEventListener('mousemove',function(e){
    mx=e.clientX;my=e.clientY;
    if(!running){running=true;glow.style.opacity='1';rafId=requestAnimationFrame(a);}
    clearTimeout(idleTimer);
    idleTimer=setTimeout(function(){running=false;if(rafId)cancelAnimationFrame(rafId);},1000);
  },{passive:true});
  document.addEventListener('mouseleave',function(){glow.style.opacity='0';running=false;if(rafId)cancelAnimationFrame(rafId);});
  document.addEventListener('mouseenter',function(){if(running)glow.style.opacity='1';});
  function a(){cx+=(mx-cx)*.08;cy+=(my-cy)*.08;glow.style.left=cx+'px';glow.style.top=cy+'px';if(running)rafId=requestAnimationFrame(a);}
})();
(function() {
  var card = document.getElementById('tilt-card');
  if (!card) return;
  card.addEventListener('mousemove', function(e) {
    var r = card.getBoundingClientRect();
    card.style.transform = 'rotateX('+((e.clientY-r.top)/r.height*2-1)*-8+'deg) rotateY('+((e.clientX-r.left)/r.width*2-1)*8+'deg)';
  });
  card.addEventListener('mouseleave', function() { card.style.transform = 'rotateX(0) rotateY(0)'; });
})();
function checkMatch(el) {
  var pwd = document.querySelector('input[name="password"]');
  var msg = document.getElementById('mismatch-msg');
  if (el.value && pwd.value && el.value !== pwd.value) {
    msg.style.display = 'block';
  } else {
    msg.style.display = 'none';
  }
}
</script>
</body>
</html>
